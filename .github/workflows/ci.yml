name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint
      - run: yarn test
      - name: Check that declaration files are up to date
        run: |
          yarn build:types
          git diff --exit-code -- '*.d.ts'
