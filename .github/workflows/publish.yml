name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: 'Dry run (no commit, tag, push, or publish)'
        required: false
        type: boolean
        default: false
      force_publish:
        description: 'Recovery: skip the version bump and publish the current package.json version (creates the tag and release only if missing)'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # push version commit + tag, create GitHub release
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # GITHUB_TOKEN cannot push the version commit to main
          # (protected, PRs required); the bot account can bypass.
          token: ${{ secrets.EXPO_BOT_PAT }}

      - name: Setup Yarn
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Configure Git
        run: |
          git config --global user.name "Expo CI"
          git config --global user.email "support+ci@expo.io"

      # On a dry run the version is bumped only in the working tree,
      # so there is no commit or tag to accidentally push.
      - name: Bump version and tag
        if: ${{ !inputs.force_publish }}
        run: npm version ${{ inputs.version }} ${{ inputs.dry_run && '--no-git-tag-version' || '' }}

      - name: Push version commit and tag
        if: ${{ !inputs.dry_run && !inputs.force_publish }}
        run: git push --follow-tags

      # Recovery for a partially failed release: the version on main is
      # already bumped, but the tag, npm publish, or release is missing.
      - name: Tag current version if missing (force publish)
        if: ${{ inputs.force_publish && !inputs.dry_run }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists on origin"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      # Authenticates via OIDC trusted publishing — no token secret needed.
      # Provenance is generated automatically.
      - name: Publish to NPM
        run: npm publish ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
